<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日→英 テスト | EIGO NO PARTNER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f1e4;
    --text: #2f3b52;
    --red: #d6473c;
    --red-light: #f5e8e7;
    --card-bg: #fffdf8;
    --border: #d4c9b0;
    --shadow: rgba(47,59,82,0.10);
    --blue: #5c7a99;
    --green: #6f8f6a;
    --gold: #c99a3b;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Zen Maru Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }
  .note-page {
    max-width: 680px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--card-bg);
    border-left: 4px solid var(--red);
    box-shadow: 2px 0 16px var(--shadow);
    padding: 32px 40px 32px 48px;
    position: relative;
  }
  .app-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .app-subtitle { font-size: 13px; color: #6b7280; margin-bottom: 28px; }
  .section-label {
    font-size: 12px; font-weight: 700; color: var(--red);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
  }
  .lesson-grid, .part-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .lesson-btn {
    padding: 8px 18px; border: 2px solid var(--border); border-radius: 999px;
    background: var(--card-bg); font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all .15s; font-family: var(--sans);
  }
  .lesson-btn:hover { border-color: var(--blue); }
  .lesson-btn.selected { border-color: var(--blue); background: var(--blue); color: #fff; }
  .part-btn {
    padding: 6px 14px; border: 2px solid var(--border); border-radius: 999px;
    background: var(--card-bg); font-size: 12px; cursor: pointer; transition: all .15s;
    font-family: var(--sans);
  }
  .part-btn:hover { border-color: var(--green); }
  .part-btn.selected { border-color: var(--green); background: var(--green); color: #fff; }
  .option-row { display: flex; align-items: center; gap: 10px; margin: 20px 0 24px; }
  .toggle-label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .toggle-label input { width: 16px; height: 16px; accent-color: var(--red); }
  .start-btn {

  .start-btn:hover { background: #b83a30; }

  .start-btn:disabled { background: #d1d5db; cursor: not-allowed; }
  .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .quiz-progress { font-size: 13px; color: #6b7280; }
  .quiz-mode-badge {

  .progress-bar-wrap {

  }

  .question-card {

  .question-label { font-size: 11px; font-weight: 700; color: #9ca3af; letter-spacing: 0.05em; margin-bottom: 8px; }
  .question-text { font-size: 20px; font-weight: 700; line-height: 1.7; }
  .mark-svg { position: absolute; top: 12px; right: 16px; width: 56px; height: 56px; }
  @keyframes drawCircle { from { stroke-dashoffset: 160; } to { stroke-dashoffset: 0; } }
  @keyframes drawCross1 { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
  @keyframes drawCross2 { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
  .circle-path {
    fill: none; stroke: var(--red); stroke-width: 3.5; stroke-linecap: round;

  .answer-area { margin-bottom: 16px; }
  .answer-input {
    width: 100%; padding: 14px 16px; background: var(--card-bg); border: 2px solid var(--border);
    border-radius: 10px; outline: none; font-size: 16px; font-family: var(--mono); transition: all .15s;
  }
  .answer-input:focus { border-color: var(--blue); }
  .answer-input.correct { border-color: var(--green); background: #f0f7ef; }
  .answer-input.wrong { border-color: var(--red); background: var(--red-light); }
  .action-row { display: flex; gap: 10px; }
  .check-btn, .next-btn {
    flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 700;
    cursor: pointer; font-size: 16px; font-family: var(--sans); color: #fff;
  }
  .check-btn { background: var(--text); }
  .check-btn:hover { background: #1a2535; }
  .next-btn { background: var(--red); }
  .next-btn:hover { background: #b83a30; }
  .feedback {
    background: #fff; border: 1px solid var(--border); border-radius: 10px;

  }
  .feedback-your { font-size: 13px; font-weight: 600; margin-bottom: 10px; font-family: var(--mono); }
  .feedback-your.correct { color: var(--green); }
  .feedback-your.wrong { color: var(--red); }
  .feedback-correct-label { font-size: 12px; font-weight: 700; color: #6b7280; margin-bottom: 6px; }
  .feedback-answer { font-size: 18px; font-weight: 700; font-family: var(--mono); }
  .result-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .result-score { font-size: 48px; font-weight: 700; color: var(--red); line-height: 1; margin: 16px 0; }
  .result-score-label { font-size: 14px; color: #6b7280; margin-bottom: 12px; }
  .result-message {
    background: var(--bg); border-radius: 12px; border-left: 4px solid var(--gold);
    padding: 16px; margin-bottom: 24px;
  }
  .mistakes-section { margin-bottom: 24px; }
  .mistakes-title { font-size: 13px; font-weight: 700; color: var(--red); letter-spacing: 0.05em; margin-bottom: 12px; }
  .mistake-item {
    padding: 12px; background: var(--bg); border-left: 3px solid var(--red);
    border-radius: 0 8px 8px 0; margin-bottom: 8px; font-size: 13px;
  }
  .mistake-q { color: #6b7280; margin-bottom: 4px; }
  .mistake-your { color: var(--red); font-size: 12px; margin-bottom: 4px; }
  .mistake-correct { font-family: var(--mono); font-size: 14px; font-weight: 600; }
  .result-btns { display: flex; flex-direction: column; gap: 10px; }
  .result-btn {
    padding: 14px; border: 2px solid var(--border); border-radius: 10px; font-weight: 700;
    cursor: pointer; background: var(--card-bg); font-family: var(--sans); font-size: 14px;
  }
  .result-btn.primary { background: var(--red); color: #fff; border-color: var(--red); }
  .result-btn.primary:hover { background: #b83a30; }

  .wk-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 7px 0; }
  .wk-label { flex: 0 0 38%; min-width: 0; word-break: break-word; }
  .wk-bar { flex: 1; height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .wk-bar > i { display: block; height: 100%; background: var(--red); }
  .wk-num { flex: 0 0 112px; text-align: right; font-family: var(--mono); }
  .wk-flag { color: var(--red); font-weight: 700; }
  .wk-dim { color: #9ca3af; }
  .wk-note { font-size: 11px; color: #9ca3af; margin: 4px 0 10px; }

  .progress-summary { font-size: 13px; color: #6b7280; margin-bottom: 16px; }
  .progress-section { margin-bottom: 18px; }
  .progress-section:last-child { margin-bottom: 0; }
  .progress-section-title { font-size: 12px; font-weight: 700; color: var(--blue); margin-bottom: 8px; }
  .progress-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .progress-badge {
    border: 2px solid var(--border); border-radius: 10px; padding: 8px 12px;
    background: var(--card-bg); cursor: pointer; font-family: var(--sans);
    font-size: 12px; display: flex; flex-direction: column; align-items: center;
    gap: 3px; min-width: 120px; transition: all .15s; white-space: nowrap;
  }
  .progress-badge:hover { transform: translateY(-1px); border-color: var(--blue); }
  .progress-badge.done { border-color: var(--green); }
  .progress-badge.todo { color: #9ca3af; }
  .progress-badge .pb-pct { font-weight: 700; color: var(--green); }
  .progress-badge .pb-status { font-size: 11px; color: #9ca3af; }
  .mini-chart-wrap { margin-bottom: 16px; }
  .mini-chart-title { font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 6px; }
  .history-row { position: relative; padding-right: 36px; }
  .history-del-btn {
    position: absolute; top: 10px; right: 10px; border: none; background: transparent;
    color: #9ca3af; font-size: 13px; cursor: pointer; padding: 3px 7px; border-radius: 6px;
    font-family: var(--sans);
  }
  .history-del-btn:hover { color: var(--red); background: var(--red-light); }
  .pb-count { font-size: 11px; font-weight: 700; color: var(--blue); }
</style>

<body>


<div class="note-page" id="app"></div>

<script src="json/words-data.js"></script>
<script>
const WORDS = window.WORDS || [];

// ---------- 縮約形展開・英語正規化（AI不使用の判定ロジック） ----------
const CONTRACTIONS_MAP = {
  "don't": "do not", "doesn't": "does not", "didn't": "did not",
  "isn't": "is not", "aren't": "are not", "wasn't": "was not", "weren't": "were not",
  "haven't": "have not", "hasn't": "has not", "hadn't": "had not",
  "won't": "will not", "wouldn't": "would not", "can't": "cannot",
  "couldn't": "could not", "shouldn't": "should not", "mustn't": "must not",
  "needn't": "need not", "i'm": "i am", "you're": "you are", "he's": "he is",
  "she's": "she is", "it's": "it is", "that's": "that is", "we're": "we are",
  "they're": "they are", "i've": "i have", "you've": "you have", "we've": "we have",
  "they've": "they have", "i'll": "i will", "you'll": "you will", "he'll": "he will",
  "she'll": "she will", "it'll": "it will", "we'll": "we will", "they'll": "they will",
  "let's": "let us",
};
const CONTRACTION_KEYS = Object.keys(CONTRACTIONS_MAP).sort((a, b) => b.length - a.length);
const CONTRACTION_RE = new RegExp('\\b(' + CONTRACTION_KEYS.join('|') + ')\\b', 'gi');

function expandContractions(text) {
  return text.toLowerCase().replace(CONTRACTION_RE, (m) => CONTRACTIONS_MAP[m.toLowerCase()]);
}
function normalizeEn(text) {
  return expandContractions(text)
    .normalize('NFKC')
    .replace(/'/g, '')
    .replace(/\b(a|an|the)\b/gi, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function compareWords(user, correct) {
  return normalizeEn(user) === normalizeEn(correct);
}

// ---------- 履歴保存 (localStorage) ----------
const HISTORY_KEY = 'ja2en_quiz_history';
const WORDSTATS_KEY = 'ja2en_quiz_wordstats';

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.warn('履歴の読み込みに失敗しました:', e);
    return [];
  }
}

function saveHistoryRecord(record) {
  try {
    const history = loadHistory();
    record.id = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    history.push(record);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (e) {
    console.warn('履歴の保存に失敗しました:', e);
  }
}

function clearHistory() {
  try {
    localStorage.removeItem(HISTORY_KEY);
    localStorage.removeItem(ATTEMPTED_KEY);
    localStorage.removeItem(WORDSTATS_KEY);
  } catch (e) {
    console.warn('履歴の削除に失敗しました:', e);
  }
}

// ---------- 出題済み問題の記録 (どの問題に「手を付けた」か) ----------
const ATTEMPTED_KEY = 'ja2en_quiz_attempted';

function getWordKey(item) {
  return item.lesson + '||' + item.part + '||' + item.ja + '||' + item.en;
}

function loadAttempted() {
  try {
    const raw = localStorage.getItem(ATTEMPTED_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) {
    console.warn('進捗の読み込みに失敗しました:', e);
    return new Set();
  }
}

function markAttempted(item) {
  try {
    const attempted = loadAttempted();
    attempted.add(getWordKey(item));
    localStorage.setItem(ATTEMPTED_KEY, JSON.stringify([...attempted]));
  } catch (e) {
    console.warn('進捗の保存に失敗しました:', e);
  }
}

// ---------- 問題単位の記録 (苦手分析用) ----------
function loadWordStats() {
  try {
    const raw = localStorage.getItem(WORDSTATS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    console.warn('問題別記録の読み込みに失敗しました:', e);
    return {};
  }
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(
        prev[j] + 1,
        cur[j - 1] + 1,
        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
    prev = cur;
  }
  return prev[n];
}

const ERR_EMPTY = '空欄（未回答）';
const ERR_PUNCT = '句読点・記号のミス（. , ? ! など）';
const ERR_ORDER = '語順違い';
const ERR_FORM = '語形違い（-s / -ed / -ing など）';
const ERR_TYPO = '綴りミス';
const ERR_MISSING = '語の欠落';
const ERR_EXTRA = '余分な語';
const ERR_OTHER = '別の単語';

function tokenDiffKind(a, b) {
  if (a === b) return null;
  const minLen = Math.min(a.length, b.length);
  if (minLen >= 2 && Math.abs(a.length - b.length) <= 3 && (a.startsWith(b) || b.startsWith(a))) return 'form';
  if (a.length >= 4 && b.length >= 4 && levenshtein(a, b) <= 2) return 'typo';
  return 'other';
}

function classifyError(user, correct) {
  if (!user || !user.trim()) return ERR_EMPTY;
  const u = normalizeEn(user).split(' ').filter(Boolean);
  const c = normalizeEn(correct).split(' ').filter(Boolean);
  if (u.length === 0) return ERR_EMPTY;

  const stripPunct = (arr) => arr.join(' ').replace(/[.,!?;:"]/g, '').replace(/\s+/g, ' ').trim();
  if (stripPunct(u) === stripPunct(c)) return ERR_PUNCT;

  if (u.length === c.length) {
    if ([...u].sort().join(' ') === [...c].sort().join(' ')) return ERR_ORDER;
    const kinds = u.map((w, i) => tokenDiffKind(w, c[i])).filter(Boolean);
    if (kinds.includes('other')) return ERR_OTHER;
    if (kinds.includes('form')) return ERR_FORM;
    if (kinds.includes('typo')) return ERR_TYPO;
    return ERR_OTHER;
  }

  const count = (arr) => arr.reduce((m, w) => { m[w] = (m[w] || 0) + 1; return m; }, {});
  const isSubset = (a, b) => {
    const cb = count(b);
    return a.every(w => (cb[w] > 0) ? (cb[w]--, true) : false);
  };
  if (u.length < c.length && isSubset(u, c)) return ERR_MISSING;
  if (u.length > c.length && isSubset(c, u)) return ERR_EXTRA;
  return ERR_OTHER;
}

function recordWordStat(item, correct, userAnswer) {
  try {
    const stats = loadWordStats();
    const key = getWordKey(item);
    const now = new Date().toISOString();
    const rec = stats[key] || {
      lesson: item.lesson, part: item.part, ja: item.ja, en: item.en,
      attempts: 0, wrong: 0, lastAt: null, lastWrongAt: null,
      wrongAnswers: [], errorTypes: {},
    };
    rec.attempts += 1;
    rec.lastAt = now;
    if (!correct) {
      rec.wrong += 1;
      rec.lastWrongAt = now;
      rec.wrongAnswers = [...(rec.wrongAnswers || []), userAnswer].slice(-5);
      const type = classifyError(userAnswer, item.en);
      rec.errorTypes = rec.errorTypes || {};
      rec.errorTypes[type] = (rec.errorTypes[type] || 0) + 1;
    }
    stats[key] = rec;
    localStorage.setItem(WORDSTATS_KEY, JSON.stringify(stats));
  } catch (e) {
    console.warn('問題別記録の保存に失敗しました:', e);
  }
}

const NOT_ED = new Set(['need', 'bed', 'red', 'feed', 'speed', 'seed', 'weed', 'breed', 'hundred', 'sacred', 'naked', 'wicked', 'tired']);
function hasPastForm(en) {
  if (/\b(was|were|did|had)\b/i.test(en)) return true;
  const words = en.toLowerCase().match(/[a-z]+/g) || [];
  return words.some(w => w.length > 3 && w.endsWith('ed') && !NOT_ED.has(w));
}

const FEATURES = [
  { label: '疑問文（?で終わる）', test: en => /\?\s*$/.test(en) },
  { label: '疑問詞で始まる文', test: en => /^\s*(what|where|who|whom|whose|when|why|how|which)\b/i.test(en) },
  { label: '否定文', test: en => /\b(not|never|no|cannot)\b|n't/i.test(en) },
  { label: '助動詞を含む', test: en => /\b(can|could|will|would|shall|should|must|may|might)\b|'ll\b/i.test(en) },
  { label: '過去形を含む', test: en => hasPastForm(en) },
  { label: '進行形', test: en => /\b(am|is|are|was|were)\s+\w+ing\b|'(m|re|s)\s+\w+ing\b/i.test(en) },
  { label: '縮約形を含む', test: en => /\w'\w/.test(en) },
  { label: '短い文（1〜3語）', test: en => en.trim().split(/\s+/).length <= 3 },
  { label: '中くらいの文（4〜6語）', test: en => { const n = en.trim().split(/\s+/).length; return n >= 4 && n <= 6; } },
  { label: '長い文（7語以上）', test: en => en.trim().split(/\s+/).length >= 7 },
];

function exportStatsJson() {
  const data = {
    exportedAt: new Date().toISOString(),
    wordstats: loadWordStats(),
    history: loadHistory(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'english-test-stats-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// 表示上のインデックス（新しい順）から元の保存順インデックスに変換して1件削除
function deleteHistoryAt(displayIndex, totalLength) {
  try {
    const history = loadHistory();
    const originalIndex = totalLength - 1 - displayIndex;
    if (originalIndex < 0 || originalIndex >= history.length) return;
    history.splice(originalIndex, 1);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (e) {
    console.warn('履歴の削除に失敗しました:', e);
  }
}

function getLessonParts(lesson) {
  return [...new Set(WORDS.filter(w => w.lesson === lesson && w.part !== '').map(w => w.part))];
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

// ---------- 進捗パネル（レッスン/パートごとの着手状況） ----------
function getProgressGroups() {
  return lessons.map(lesson => {
    const label = lesson === 'Starter' ? 'Starter' : 'Lesson ' + lesson;
    const parts = getLessonParts(lesson);
    const badges = [];
    // パートのないレッスン（Starter）だけ「すべて」を出す。それ以外はパート単位で進めるため不要
    if (parts.length === 0) badges.push({ badgeLabel: 'すべて', lesson, part: 'all', matchParts: ['all'] });
    parts.forEach(p => badges.push({ badgeLabel: 'Part ' + p, lesson, part: p, matchParts: [p, 'all'] }));
    return { groupLabel: label, badges };
  });
}

function getBadgeStatus(badge, history) {
  const matches = history.filter(h => h.lesson === badge.lesson && badge.matchParts.includes(h.part));
  if (matches.length === 0) return { done: false };
  matches.sort((a, b) => new Date(b.date) - new Date(a.date));
  return { done: true, latest: matches[0], count: matches.length };
}

function renderProgressPanel(history) {
  const attempted = loadAttempted();
  const groups = getProgressGroups();
  let doneCount = 0, totalCount = 0;

  const sectionsHtml = groups.map(g => {
    const badgesHtml = g.badges.map(b => {
      const status = getBadgeStatus(b, history);
      totalCount++;
      if (status.done) doneCount++;
      const cls = status.done ? 'done' : 'todo';

      const items = b.part === 'all'
        ? WORDS.filter(w => w.lesson === b.lesson)
        : WORDS.filter(w => w.lesson === b.lesson && w.part === b.part);
      const wTotal = items.length;
      const wDone = items.filter(w => attempted.has(getWordKey(w))).length;

      const right = status.done
        ? `<span class="pb-count">${wDone} / ${wTotal}問</span><span class="pb-pct">${status.latest.pct}%</span>`
        : `<span class="pb-status">未着手</span>`;
      const title = status.done
        ? `直近: ${formatDateShort(status.latest.date)}（${status.count}回挑戦）`
        : 'まだ挑戦していません';
      return `
        <button class="progress-badge ${cls}" data-plesson="${esc(b.lesson)}" data-ppart="${esc(b.part)}" title="${esc(title)}">
          <span>${esc(b.badgeLabel)}</span>
          ${right}
        </button>`;
    }).join('');
    return `
      <div class="progress-section">
        <div class="progress-section-title">${esc(g.groupLabel)}</div>
        <div class="progress-grid">${badgesHtml}</div>
      </div>`;
  }).join('');

  return `
    <div class="progress-summary">進捗状況: ${doneCount} / ${totalCount} 項目に着手済み</div>
    ${sectionsHtml}`;
}

// ---------- レッスン/パート別の推移チャート ----------
function renderPerGroupCharts(history) {
  const groups = {};
  history.forEach(h => {
    const key = h.lesson + '||' + (h.part || 'all');
    if (!groups[key]) groups[key] = [];
    groups[key].push(h);
  });
  const keys = Object.keys(groups).sort();
  if (keys.length === 0) return '<div class="empty-msg">まだ履歴がありません。</div>';

  return keys.map(key => {
    const [lesson, part] = key.split('||');
    const lessonLabel = lesson === 'Starter' ? 'Starter' : 'Lesson ' + lesson;
    const partLabel = (part && part !== 'all') ? ' / Part ' + part : ' / すべて';
    const sorted = groups[key].slice().sort((a, b) => new Date(a.date) - new Date(b.date)).slice(-20);
    return `
      <div class="mini-chart-wrap">
        <div class="mini-chart-title">${esc(lessonLabel + partLabel)}（${groups[key].length}回）</div>
        ${renderChart(sorted)}
      </div>`;
  }).join('');
}

// ---------- アプリ状態 ----------
const state = {
  screen: 'start',
  selectedLesson: null,
  selectedPart: null,
  parts: [],
  queue: [],
  currentIndex: 0,
  results: [],
  isAnswered: false,
  feedback: null,
  markResult: null,
  currentHistoryFilter: null,
};
const lessons = [...new Set(WORDS.map(w => w.lesson))];

const app = document.getElementById('app');

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function render() {
  if (state.screen === 'start') return renderStart();
  if (state.screen === 'quiz') return renderQuiz();
  if (state.screen === 'result') return renderResult();
  if (state.screen === 'history') return renderHistory();
  if (state.screen === 'weak') return renderWeak();
}

function renderStart() {
  const lessonBtns = lessons.map(l => `
    <button class="lesson-btn ${state.selectedLesson === l ? 'selected' : ''}" data-lesson="${esc(l)}">
      ${l === 'Starter' ? 'Starter' : 'Lesson ' + esc(l)}
    </button>`).join('');

  let partSection = '';
  if (state.selectedLesson && state.parts.length > 0) {
    const partBtns = state.parts.map(p => `
      <button class="part-btn ${state.selectedPart === p ? 'selected' : ''}" data-part="${esc(p)}">
        Part ${esc(p)}
      </button>`).join('');
    partSection = `
      <div style="margin-top:20px;">
        <div class="section-label">パートを選ぶ</div>
        <div class="part-row">
          ${partBtns}
        </div>
      </div>`;
  }

  app.innerHTML = `
    <div class="app-title">📖 日→英 テスト</div>
    <div class="app-subtitle">EIGO NO PARTNER</div>

    <div class="section-label">レッスンを選ぶ</div>
    <div class="lesson-grid">${lessonBtns}</div>

    ${partSection}

    <div class="option-row">
      <label class="toggle-label">
        <input type="checkbox" id="shuffle-check">
        シャッフルする
      </label>
    </div>

    <button id="start-btn" class="start-btn" ${(state.selectedLesson === null || (state.parts.length > 0 && !state.selectedPart)) ? 'disabled' : ''}>開始</button>
    <button id="history-btn" class="result-btn" style="width:100%;margin-top:10px;">📊 履歴を見る</button>
    <button id="weak-btn" class="result-btn" style="width:100%;margin-top:10px;">📉 苦手分析</button>
  `;

  app.querySelectorAll('[data-lesson]').forEach(btn => {
    btn.addEventListener('click', () => selectLesson(btn.dataset.lesson));
  });
  app.querySelectorAll('[data-part]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.selectedPart = btn.dataset.part;
      render();
    });
  });
  const startBtn = document.getElementById('start-btn');
  if (startBtn) {
    startBtn.addEventListener('click', () => {
      const shuffle = document.getElementById('shuffle-check').checked;
      startQuiz(shuffle);
    });
  }
  document.getElementById('history-btn').addEventListener('click', () => {
    state.screen = 'history';
    render();
  });
  document.getElementById('weak-btn').addEventListener('click', () => {
    state.screen = 'weak';
    render();
  });
}

function selectLesson(lesson) {
  const parts = [...new Set(
    WORDS.filter(w => w.lesson === lesson && w.part !== '').map(w => w.part)
  )];
  state.selectedLesson = lesson;
  // パートのあるレッスンはパート単位で進めるため、未選択から始める（パートのないStarterだけ全体）
  state.selectedPart = parts.length > 0 ? null : 'all';
  state.parts = parts;
  render();
}

function startQuiz(shuffle) {
  let items = WORDS.filter(w => w.lesson === state.selectedLesson);
  if (state.selectedPart && state.selectedPart !== 'all') {
    items = items.filter(w => w.part === state.selectedPart);
  }
  if (shuffle) items = [...items].sort(() => Math.random() - 0.5);

  state.queue = items;
  state.currentIndex = 0;
  state.results = [];
  state.isAnswered = false;
  state.feedback = null;
  state.markResult = null;
    state.currentAnswer = '';
  state.screen = 'quiz';
  render();
}

function renderQuiz() {
  if (state.queue.length === 0) {
    app.innerHTML = `<div class="empty-msg">この範囲には問題がありません。</div>
      <button class="result-btn" id="back-btn">選択に戻る</button>`;
    document.getElementById('back-btn').addEventListener('click', () => { state.screen = 'start'; render(); });
    return;
  }
  const item = state.queue[state.currentIndex];
  const pct = (state.currentIndex / state.queue.length) * 100;

  let markSvg = '';
  if (state.markResult === true) {
    markSvg = `<svg class="mark-svg" viewBox="0 0 56 56"><circle cx="28" cy="28" r="22" class="circle-path" /></svg>`;
  } else if (state.markResult === false) {
    markSvg = `<svg class="mark-svg" viewBox="0 0 56 56">
      <line x1="12" y1="12" x2="44" y2="44" class="cross-path1" />
      <line x1="44" y1="12" x2="12" y2="44" class="cross-path2" />
    </svg>`;
  }

  let feedbackHtml = '';
  if (state.feedback) {
    const userLine = state.feedback.userAnswer
      ? `<div class="feedback-your ${state.feedback.correct ? 'correct' : 'wrong'}">あなたの回答: ${esc(state.feedback.userAnswer)}</div>`
      : `<div class="feedback-your wrong">あなたの回答: （未回答）</div>`;
    feedbackHtml = `
      <div class="feedback">
        ${userLine}
        <div class="feedback-correct-label">✏️ 正解</div>
        <div class="feedback-answer">${esc(state.feedback.answerText)}</div>
      </div>`;
  }

  const partLabel = (state.selectedPart && state.selectedPart !== 'all')
    ? `<span style="color:#d1d5db;margin:0 2px;">/</span><span class="cur">Part ${esc(state.selectedPart)}</span>`
    : '';

  app.innerHTML = `
    <div class="quiz-header">
      <div class="quiz-progress">${state.currentIndex + 1} / ${state.queue.length}</div>
      <div class="quiz-mode-badge">日→英</div>
    </div>
    <div class="location-indicator">
      <span>📖</span>
      <span class="cur">${state.selectedLesson === 'Starter' ? 'Starter' : 'Lesson ' + esc(state.selectedLesson)}</span>
      ${partLabel}
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>

    <div class="question-card">
      <div class="question-label">日本語</div>
      <div class="question-text">${esc(item.ja)}</div>
      ${markSvg}
    </div>

    <div class="answer-area">
      <input type="text" id="answer-input" class="answer-input ${state.isAnswered ? (state.markResult ? 'correct' : 'wrong') : ''}" placeholder="Type in English…" value="${esc(state.currentAnswer || '')}" ${state.isAnswered ? 'readonly' : ''} autofocus>
    </div>

    ${feedbackHtml}

    <div class="action-row">
      ${!state.isAnswered ? `<button class="check-btn" id="check-btn">判定</button>` : ''}
      ${state.isAnswered ? `<button class="next-btn" id="next-btn">${state.currentIndex === state.queue.length - 1 ? '結果を見る' : '次へ →'}</button>` : ''}
    </div>
  `;

  const input = document.getElementById('answer-input');
  input.focus();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (!state.isAnswered) checkAnswer(); else nextQuestion();
    }
  });
  const checkBtn = document.getElementById('check-btn');
  if (checkBtn) checkBtn.addEventListener('click', checkAnswer);
  const nextBtn = document.getElementById('next-btn');
  if (nextBtn) nextBtn.addEventListener('click', nextQuestion);
}

function checkAnswer() {
  if (state.isAnswered) return;
  const item = state.queue[state.currentIndex];
  const input = document.getElementById('answer-input');
  const userRaw = input.value.trim();

  const correct = compareWords(userRaw, item.en);

  state.isAnswered = true;
  state.currentAnswer = userRaw;
  state.results.push({ item, correct, userAnswer: userRaw });
  markAttempted(item);
  recordWordStat(item, correct, userRaw);
  state.feedback = { answerText: item.en, userAnswer: userRaw, correct };
  state.markResult = correct;

  render();
}

function nextQuestion() {
  if (state.currentIndex === state.queue.length - 1) {
    state.screen = 'result';
    const total = state.results.length;
    const correctCount = state.results.filter(r => r.correct).length;
    saveHistoryRecord({
      date: new Date().toISOString(),
      lesson: state.selectedLesson,
      part: state.selectedPart,
      correct: correctCount,
      total: total,
      pct: total > 0 ? Math.round((correctCount / total) * 100) : 0,
    });
  } else {
    state.currentIndex += 1;
    state.isAnswered = false;
    state.feedback = null;
    state.markResult = null;
    state.currentAnswer = '';
  }
  render();
}

function renderResult() {
  const total = state.results.length;
  const correct = state.results.filter(r => r.correct).length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const mistakes = state.results.filter(r => !r.correct);

  const message = pct === 100 ? '完璧です！素晴らしい！'
    : pct >= 80 ? 'よくできました！'

      <button class="result-btn" id="retry-all-btn">全部再挑戦</button>
      <button class="result-btn" id="back-to-start-btn">選択に戻る</button>
      <button class="result-btn" id="view-history-btn">📊 履歴を見る</button>

function renderWeak() {
  const stats = loadWordStats();
  const recs = Object.values(stats);

  if (recs.length === 0) {
    app.innerHTML = `
      <div class="app-title">📉 苦手分析</div>
      <div class="empty-msg">まだ問題別の記録がありません。テストを解くと、ここに間違えた問題と傾向が表示されます。<br>（問題別の記録は、この機能の追加後に解いた分から貯まります）</div>
      <button class="result-btn" id="weak-back-btn" style="margin-top:16px;width:100%;">選択に戻る</button>
    `;
    document.getElementById('weak-back-btn').addEventListener('click', () => { state.screen = 'start'; render(); });
    return;
  }

  const MIN = 3;
  const totalAttempts = recs.reduce((s, r) => s + r.attempts, 0);
  const totalWrong = recs.reduce((s, r) => s + r.wrong, 0);
  const baseRate = totalAttempts > 0 ? totalWrong / totalAttempts : 0;
  const pctStr = (x) => Math.round(x * 100) + '%';

  const rateRow = (label, attempts, wrong) => {
    if (attempts < MIN) {
      return `<div class="wk-row wk-dim"><div class="wk-label">${esc(label)}</div><div class="wk-bar"></div><div class="wk-num">データ不足 (${wrong}/${attempts})</div></div>`;
    }
    const rate = wrong / attempts;
    const flag = rate - baseRate >= 0.10;
    return `<div class="wk-row"><div class="wk-label ${flag ? 'wk-flag' : ''}">${flag ? '▲ ' : ''}${esc(label)}</div>
      <div class="wk-bar"><i style="width:${Math.round(rate * 100)}%"></i></div>
      <div class="wk-num">${pctStr(rate)} (${wrong}/${attempts})</div></div>`;
  };

  // (a) 間違い回数ランキング
  const ranking = recs.filter(r => r.wrong > 0).sort((a, b) =>
    b.wrong - a.wrong ||
    (b.wrong / b.attempts) - (a.wrong / a.attempts) ||
    String(b.lastWrongAt).localeCompare(String(a.lastWrongAt))
  ).slice(0, 30);
  const lessonLabel = (r) => (r.lesson === 'Starter' ? 'Starter' : 'Lesson ' + r.lesson) + (r.part ? ' / Part ' + r.part : '');
  const rankingHtml = ranking.length === 0
    ? '<div class="empty-msg">間違えた問題はまだありません。</div>'
    : ranking.map((r, i) => {
        const last = (r.wrongAnswers && r.wrongAnswers.length) ? r.wrongAnswers[r.wrongAnswers.length - 1] : '';
        const types = Object.entries(r.errorTypes || {}).map(([k, v]) => `${k}×${v}`).join(' / ');
        return `
        <div class="mistake-item">
          <div class="mistake-q">${i + 1}. ${esc(r.ja)}</div>
          <div class="mistake-your">直近の誤答: ${esc(last || '（未回答）')}</div>
          <div class="mistake-correct">${esc(r.en)}</div>
          <div class="mistake-q" style="margin:4px 0 0; font-size:11px;">❌ ${r.wrong}回 / ${r.attempts}回出題（${esc(lessonLabel(r))}）${types ? ' ・ ' + esc(types) : ''}</div>
        </div>`;
      }).join('');

  // (b) レッスン/パート別
  const groups = {};
  recs.forEach(r => {
    const k = r.lesson + '||' + (r.part || '');
    if (!groups[k]) groups[k] = { label: lessonLabel(r), attempts: 0, wrong: 0 };
    groups[k].attempts += r.attempts;
    groups[k].wrong += r.wrong;
  });
  const groupList = Object.values(groups).sort((a, b) => {
    const ad = a.attempts < MIN, bd = b.attempts < MIN;
    if (ad !== bd) return ad ? 1 : -1;
    return (b.wrong / b.attempts) - (a.wrong / a.attempts);
  });
  const groupHtml = groupList.map(g => rateRow(g.label, g.attempts, g.wrong)).join('');

  // (c) 誤答タイプ別
  const typeCount = {};
  recs.forEach(r => Object.entries(r.errorTypes || {}).forEach(([k, v]) => { typeCount[k] = (typeCount[k] || 0) + v; }));
  const typeList = Object.entries(typeCount).sort((a, b) => b[1] - a[1]);
  const typeTotal = typeList.reduce((s, [, v]) => s + v, 0);
  const typeHtml = typeList.length === 0
    ? '<div class="empty-msg">誤答の記録がありません。</div>'
    : typeList.map(([k, v]) => `
      <div class="wk-row"><div class="wk-label">${esc(k)}</div>
        <div class="wk-bar"><i style="width:${Math.round(v / typeTotal * 100)}%"></i></div>
        <div class="wk-num">${v}件 (${pctStr(v / typeTotal)})</div></div>`).join('');

  // (d) 英文の特徴別
  const featRows = FEATURES.map(f => {
    let attempts = 0, wrong = 0;
    recs.forEach(r => { if (f.test(r.en)) { attempts += r.attempts; wrong += r.wrong; } });
    return { label: f.label, attempts, wrong };
  }).filter(f => f.attempts > 0).sort((a, b) => {
    const ad = a.attempts < MIN, bd = b.attempts < MIN;
    if (ad !== bd) return ad ? 1 : -1;
    return (b.wrong / b.attempts) - (a.wrong / a.attempts);
  });
  const featHtml = featRows.map(f => rateRow(f.label, f.attempts, f.wrong)).join('');

  app.innerHTML = `
    <div class="app-title">📉 苦手分析</div>
    <div class="progress-summary">記録済み ${recs.length}問 ／ 回答 ${totalAttempts}回 ／ 誤答 ${totalWrong}回（全体の誤答率 ${pctStr(baseRate)}）</div>

    <div class="section-label">間違い回数ランキング（上位30問）</div>
    ${rankingHtml}

    <div class="section-label" style="margin-top:24px;">レッスン/パート別の誤答率</div>
    <div class="wk-note">▲ は全体の誤答率より10ポイント以上高い項目。回答3回未満は「データ不足」</div>
    ${groupHtml}

    <div class="section-label" style="margin-top:24px;">誤答タイプ別</div>
    <div class="wk-note">綴りミス・語形違いなどは自動判定の目安です</div>
    ${typeHtml}

    <div class="section-label" style="margin-top:24px;">英文の特徴別の誤答率</div>
    <div class="wk-note">1問が複数の特徴に当てはまることがあります</div>
    ${featHtml}

    <div class="result-btns" style="margin-top:24px;">
      <button class="result-btn" id="weak-export-btn">⬇ JSONエクスポート</button>
      <button class="result-btn" id="weak-back-btn">選択に戻る</button>
    </div>
  `;
  document.getElementById('weak-export-btn').addEventListener('click', exportStatsJson);
  document.getElementById('weak-back-btn').addEventListener('click', () => { state.screen = 'start'; render(); });
}

function setHistoryFilter(filter) {
  state.currentHistoryFilter = filter;
}

function clearHistoryFilter() {
  state.currentHistoryFilter = null;
}

function getPartStatistics(history) {
  const stats = {};
  history.forEach(h => {
    const key = h.lesson + '||' + (h.part || 'all');
    if (!stats[key]) {
      stats[key] = {
        lesson: h.lesson,
        part: h.part || 'all',
        attempts: 0,
        totalPct: 0,
        bestPct: 0
      };
    }
    stats[key].attempts++;
    stats[key].totalPct += h.pct;
    if (h.pct > stats[key].bestPct) {
      stats[key].bestPct = h.pct;
    }
  });

  return Object.values(stats).map(s => ({
    ...s,
    avgPct: Math.round(s.totalPct / s.attempts)
  })).sort((a, b) => {
    if (a.lesson !== b.lesson) return a.lesson.localeCompare(b.lesson);
    return a.part.localeCompare(b.part);
  });
}

function renderHistory() {
  const fullHistory = loadHistory().slice().reverse(); // 新しい順

  if (fullHistory.length === 0) {
    app.innerHTML = `
      <div class="app-title">📊 履歴</div>
      <div class="empty-msg">まだテスト履歴がありません。</div>
      <button class="result-btn" id="back-btn" style="margin-top:16px;">選択に戻る</button>
    `;
    document.getElementById('back-btn').addEventListener('click', () => { state.screen = 'start'; render(); });
    return;
  }

  // フィルタ適用（state から状態を取得）
  const filter = state.currentHistoryFilter;
  const history = filter
    ? fullHistory.filter(h => h.lesson === filter.lesson && h.part === filter.part)
    : fullHistory;

  // 全体とフィルタ後の統計を計算
  const calcStats = (list) => ({
    total: list.length,
    avgPct: list.length > 0 ? Math.round(list.reduce((s, r) => s + r.pct, 0) / list.length) : 0,
    bestPct: list.length > 0 ? Math.max(...list.map(r => r.pct)) : 0,
  });
  const allStats = calcStats(fullHistory);
  const filtStats = calcStats(history);

  // フィルターバッジの表示名
  const activeBadgeKey = filter ? `${filter.lesson}||${filter.part}` : null;

  const partStats = getPartStatistics(fullHistory);
  const filterablePartStatsHtml = partStats.map(s => {
    const lessonLabel = s.lesson === 'Starter' ? 'Starter' : 'Lesson ' + esc(s.lesson);
    const partLabel = (s.part && s.part !== 'all') ? ' / Part ' + esc(s.part) : '';
    const isActive = `${s.lesson}||${s.part}` === activeBadgeKey;
    const badgeCls = isActive ? 'done' : '';
    const style = isActive
      ? 'border-color: var(--blue); background: var(--blue); color: #fff; transform: translateY(-2px); box-shadow: 0 2px 8px var(--shadow);'
      : '';
    return `
      <button class="progress-badge ${badgeCls}" data-stat-filter-lesson="${esc(s.lesson)}" data-stat-filter-part="${esc(s.part)}" style="cursor:pointer; ${style}">
        <span style="font-weight:600; margin-bottom:6px;">${esc(lessonLabel + partLabel)}</span>
        <span class="pb-count">${s.attempts}回</span>
        <span class="pb-pct">平均 ${s.avgPct}%</span>
        <span style="font-size:11px; color:var(--gold); font-weight:600;">最高 ${s.bestPct}%</span>
        ${isActive ? '<span style="font-size:11px;">●選択中</span>' : ''}
      </button>
    `;
  }).join('');

  // 「すべて表示」バッジの計算
  const allBadgeActive = !filter;
  const allBadgeStyle = allBadgeActive
    ? 'border-color: var(--blue); background: var(--blue); color: #fff; transform: translateY(-2px); box-shadow: 0 2px 8px var(--shadow);'
    : '';

  const progressHtml = renderProgressPanel(fullHistory);
  const chartsHtml = renderPerGroupCharts(fullHistory);

  // 現在の履歴リスト（フィルタ済み）
  const listHtml = history.map((r, i) => {
    const d = new Date(r.date);
    const dateStr = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    const lessonLabel = r.lesson === 'Starter' ? 'Starter' : 'Lesson ' + esc(r.lesson);
    const partLabel = (r.part && r.part !== 'all') ? ` / Part ${esc(r.part)}` : '';
    return `
      <div class="mistake-item history-row" style="border-left-color: ${r.pct >= 80 ? 'var(--green)' : r.pct >= 50 ? 'var(--gold)' : 'var(--red)'};">
        <button class="history-del-btn" data-del-index="${i}" data-filtered="true" title="この履歴を削除">✕</button>
        <div class="mistake-q">${dateStr} ${lessonLabel}${partLabel}</div>
        <div class="mistake-correct">${r.correct} / ${r.total} 問正解（${r.pct}%）</div>
      </div>`;
  }).join('');

  // フィルターバー
  const filterBarHtml = filter
    ? `<div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
         <span style="font-size:13px; font-weight:600; color:var(--blue);">🔍 フィルター: ${filter.lesson === 'Starter' ? 'Starter' : 'Lesson ' + esc(filter.lesson)}${(filter.part && filter.part !== 'all') ? ' / Part ' + esc(filter.part) : ''}</span>
         <button class="part-btn" id="clear-filter-btn" style="background: var(--blue); color: #fff; border-color: var(--blue);">✕ クリア</button>
       </div>`
    : '';

  app.innerHTML = `
    <div class="app-title">📊 履歴</div>
    <div class="app-subtitle">${filter ? '（フィルター適用中）' : 'これまでのテスト結果'}</div>

    <div style="display:flex; gap:10px; margin-bottom:20px;">
      <div style="flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center;">
        <div style="font-size:11px; color:#9ca3af; margin-bottom:4px;">表示回数</div>
        <div style="font-size:20px; font-weight:700;">${filtStats.total}</div>
      </div>
      <div style="flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center;">
        <div style="font-size:11px; color:#9ca3af; margin-bottom:4px;">平均正答率</div>
        <div style="font-size:20px; font-weight:700; color:var(--blue);">${filtStats.avgPct}%</div>
      </div>
      <div style="flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center;">
        <div style="font-size:11px; color:#9ca3af; margin-bottom:4px;">最高記録</div>
        <div style="font-size:20px; font-weight:700; color:var(--gold);">${filtStats.bestPct}%</div>
      </div>
    </div>

    <div class="section-label">パート別統計（クリックでフィルタ）</div>
    ${filterBarHtml}
    <div class="progress-grid" style="margin-bottom:20px;">
      <button class="progress-badge ${allBadgeActive ? 'done' : ''}" id="show-all-stats" style="cursor:pointer; ${allBadgeStyle}">
        <span style="font-weight:600; margin-bottom:6px;">すべて表示</span>
        <span class="pb-count">${allStats.total}回</span>
        <span class="pb-pct">平均 ${allStats.avgPct}%</span>
        <span style="font-size:11px; color:var(--gold); font-weight:600;">最高 ${allStats.bestPct}%</span>
        ${allBadgeActive ? '<span style="font-size:11px;">●選択中</span>' : ''}
      </button>
      ${filterablePartStatsHtml}
    </div>

    <div class="section-label">進捗パネル（クリックでそのまま挑戦）</div>
    ${progressHtml}

    <div class="section-label" style="margin-top:24px;">レッスン別の推移</div>
    ${chartsHtml}

    <div class="section-label" style="margin-top:24px;">テスト履歴（${filter ? 'フィルター済み' : '新しい順'}）</div>
    <div id="history-list-section">${listHtml || '<div class="empty-msg">この条件の履歴はありません。</div>'}</div>

    <div class="result-btns" style="margin-top:20px;">
      <button class="result-btn" id="back-btn">選択に戻る</button>
      <button class="result-btn" id="to-weak-btn">📉 苦手分析</button>
      <button class="result-btn" id="clear-history-btn" style="color:var(--red); border-color:var(--red);">🗑 履歴をすべて削除</button>
    </div>
  `;

  document.getElementById('back-btn').addEventListener('click', () => { state.screen = 'start'; render(); });
  document.getElementById('to-weak-btn').addEventListener('click', () => { state.screen = 'weak'; render(); });
  document.getElementById('clear-history-btn').addEventListener('click', () => {
    if (confirm('履歴と問題別の記録（苦手分析のデータ）をすべて削除しますか？この操作は取り消せません。')) {
      clearHistory();
      render();
    }
  });

  // 個別削除ボタンのイベント設定（フィルタ用）
  app.querySelectorAll('[data-del-index][data-filtered="true"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm('この履歴を削除しますか？')) {
        deleteSingleHistoryItem(Number(btn.dataset.delIndex));
      }
    });
  });

  // 進捗バッジのクリック（そのレッスン/パートのクイズを開始）
  app.querySelectorAll('[data-plesson]').forEach(btn => {
    btn.addEventListener('click', () => {
      const lesson = btn.dataset.plesson;
      const part = btn.dataset.ppart;
      state.selectedLesson = lesson;
      state.parts = getLessonParts(lesson);
      state.selectedPart = part;
      startQuiz(false);
    });
  });

  // 「すべて表示」ボタンのクリック
  document.getElementById('show-all-stats').addEventListener('click', () => {
    clearHistoryFilter();
    render();
  });

  // 「フィルタークリア」ボタンのクリック
  const clearFilterBtn = document.getElementById('clear-filter-btn');
  if (clearFilterBtn) {
    clearFilterBtn.addEventListener('click', () => {
      clearHistoryFilter();
      render();
    });
  }

  // 統計バッジのクリック（履歴フィルタを適用）
  app.querySelectorAll('[data-stat-filter-lesson]').forEach(card => {
    card.addEventListener('click', () => {
      const lesson = card.dataset.statFilterLesson;
      const part = card.dataset.statFilterPart;
      setHistoryFilter({ lesson, part });
      render();
    });
  });
}
function deleteSingleHistoryItem(displayIndex) {
  const filter = state.currentHistoryFilter;
  const fullReversed = loadHistory().slice().reverse();

  const history = filter
    ? fullReversed.filter(h => h.lesson === filter.lesson && h.part === filter.part)
    : fullReversed;

  if (displayIndex < 0 || displayIndex >= history.length) return;

  const targetItem = history[displayIndex];
  const realIndex = fullReversed.findIndex(h =>
    h.date === targetItem.date &&
    h.lesson === targetItem.lesson &&
    h.part === targetItem.part
  );
  if (realIndex >= 0) {
    deleteHistoryAt(realIndex, fullReversed.length);
  }
}

function renderChart(data) {
  if (data.length === 0) return '';
  const w = 596, h = 160, padL = 30, padB = 20, padT = 10, padR = 10;
  const chartW = w - padL - padR;
  const chartH = h - padT - padB;

  const gridLines = [0, 25, 50, 75, 100].map(v => {
    const y = padT + chartH - (v / 100) * chartH;
    return `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="var(--border)" stroke-width="1" />
      <text x="${padL - 6}" y="${y + 3}" font-size="9" fill="#9ca3af" text-anchor="end" font-family="var(--mono)">${v}</text>`;
  }).join('');

  const stepX = data.length > 1 ? chartW / (data.length - 1) : 0;
  const pointFor = (r, i) => {
    const x = data.length > 1 ? padL + i * stepX : padL + chartW / 2;
    const y = padT + chartH - (r.pct / 100) * chartH;
    return { x, y };
  };
  const points = data.map(pointFor);

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
  const areaPath = `${linePath} L ${points[points.length - 1].x} ${padT + chartH} L ${points[0].x} ${padT + chartH} Z`;

  const dots = points.map((p, i) => {
    const r = data[i];
    const color = r.pct >= 80 ? 'var(--green)' : r.pct >= 50 ? 'var(--gold)' : 'var(--red)';
    return `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}" stroke="var(--card-bg)" stroke-width="1.5">
      <title>${r.pct}%</title>
    </circle>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; background:var(--card-bg); border:1px solid var(--border); border-radius:10px;">
      ${gridLines}
      <path d="${areaPath}" fill="var(--red)" fill-opacity="0.08" stroke="none" />
      <path d="${linePath}" fill="none" stroke="var(--red)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      ${dots}
    </svg>`;
}

render();
</script>
</body>
</html>
